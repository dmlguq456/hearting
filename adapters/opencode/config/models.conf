# adapters/opencode/config/models.conf
# OpenCode adapter — the SOLE declaration of concrete OpenCode model IDs
# (provider/model-id) and variants. role-map.sh derives from this file. A
# concrete model ID outside this file (and generated regions) is a fail-closed
# guard violation (tools/check-model-config.py).
#
# This is the shipped release default. The user-effective copy lives at
# <opencode-runtime-home>/agent-config/models.conf and is selected whole-file.
# Runtime env vars still override (AGENT_MODEL_FAST/BALANCED/DEEP,
# AGENT_VARIANT_*); this file is the default source. OpenCode uses a
# provider/model-id string plus a variant field (no numeric reasoning effort).
# Verified against the local opencode-go provider registry (opencode 1.18.27,
# 2026-09-03; 2026-09-03 tier refresh: glm-5.3 and glm-5.3-flash released
# 2026-08-14/26, same-or-cheaper than the prior glm-5.2 / deepseek-v4-flash rows,
# so the ladder moved at no price step — qwen3.8-max stays the deep flagship).
# Tuning preference: prefer changing an effort/variant tier over a model tier.

# --- Tiers: concrete provider/model-id + variant ---
# Tier selection here is account-shaped, not a claim about vendor capability
# (2026-08-07 사용자 결정). This account's opencode-go plan carries a much smaller
# window than the Claude/Codex accounts, so the ladder is built around the cheapest
# model that still does the work: glm-5.3-flash covers BOTH light and mini, and
# only the two deep-side tiers spend on a larger model. Nothing portable may restate
# this as a durable capacity claim about a vendor (OPERATIONS §5.10) — one account.
#
# OpenCode declares its own `balanced-deep` TIER because it has no effort axis to
# separate that profile from `deep`. Claude/Codex reach the same operating point by
# lowering effort on the deep model; here the separation is carried by the model
# itself (qwen3.8-max vs glm-5.3), which is the only granularity this runtime has.
CFG_TIER_DEEP_MODEL=opencode-go/qwen3.8-max
CFG_TIER_DEEP_VARIANT=runtime-default
CFG_TIER_BALANCED_DEEP_MODEL=opencode-go/glm-5.3
CFG_TIER_BALANCED_DEEP_VARIANT=runtime-default
CFG_TIER_LIGHT_MODEL=opencode-go/glm-5.3-flash
CFG_TIER_LIGHT_VARIANT=runtime-default
CFG_TIER_MINI_MODEL=opencode-go/glm-5.3-flash
CFG_TIER_MINI_VARIANT=runtime-default

# --- Portable execution profiles (tier:variant), SD-88. OpenCode has no verified
#     effort axis, so every profile separation must be carried by the model. The
#     deep-side split is real (qwen3.8-max vs glm-5.3), which is why balanced-deep no
#     longer collapses into deep. Only `mini` still collapses — into `light`, because
#     this account deliberately puts both on glm-5.3-flash — so the granularity
#     value names that one collapse and nothing more (ADAPTATION §3, CONVENTIONS §1). ---
CFG_MODEL_PROFILE_DEEP=deep:runtime-default
CFG_MODEL_PROFILE_BALANCED_DEEP=balanced-deep:runtime-default
CFG_MODEL_PROFILE_LIGHT=light:runtime-default
CFG_MODEL_PROFILE_MINI=mini:runtime-default
CFG_MODEL_PROFILE_GRANULARITY=collapsed-mini

# --- deep-tier capacity failover (model-granularity), consumed by SD-59
#     capacity_cascade_next: qwen3.8-max exhausted -> glm-5.3 -> glm-5.3-flash.
#     The first step lands on the declared balanced-deep tier instead of dropping
#     straight to light, so a capacity failure costs one rung rather than two. ---
CFG_TIER_DEEP_FAILOVER=balanced-deep
CFG_TIER_DEEP_FAILOVER_CASCADE="opencode-go/qwen3.8-max:runtime-default opencode-go/glm-5.3:runtime-default opencode-go/glm-5.3-flash:runtime-default"

# --- OpenCode bucket -> tier mapping is retained for non-route role selection.
#     Registered topology never infers a profile from these buckets. ---

# --- Native subagent type catalog (agent-name:portable-profile) ---
# Cross-harness parity with the Claude catalog (same names, same portable
# profiles, resolved through this adapter's CFG_MODEL_PROFILE_* rows by
# sync-native-agents.py; the variant axis stays runtime-default).
CFG_NATIVE_AGENT_CATALOG="general-purpose:balanced-deep light:light deep:deep"
