# adapters/opencode/config/models.conf
# OpenCode adapter — the SOLE declaration of concrete OpenCode model IDs
# (provider/model-id) and variants. role-map.sh derives from this file. A
# concrete model ID outside this file (and generated regions) is a fail-closed
# guard violation (tools/check-model-config.py).
#
# This is the shipped release default. The user-effective copy lives at
# <opencode-runtime-home>/agent-config/models.conf and is selected whole-file.
# Runtime env vars still override (AGENT_MODEL_FAST/BALANCED/DEEP,
# AGENT_VARIANT_*); this file is the default source. OpenCode takes a
# provider/model-id string plus a variant field in V1; V2 uses the
# provider/model#variant reference. The V1 Go variant registry was checked on
# opencode 1.18.33 (`reasoning_options`, 2026-09-30). V2 fallback candidates
# remain unknown until scoped runtime evidence records a real request result.
# Tuning preference: prefer changing an effort/variant tier over a model tier.

# --- Tiers: concrete provider/model-id + variant ---
# 2026-09-30 maintainer decision: light = deepseek-v4.1-flash at its top supported variant
# (xhigh is not offered by this model, so `max`), mini = the same model one step
# lower (`high`), balanced-deep = muse-spark-1.3-contributor @ xhigh. Tier selection
# is account-shaped, not a claim about vendor capability. The contributor plan
# terms of muse-spark are not verifiable from local material; the user chose it.
# No `openai/*` role tier is declared; the V2 fallback list is separate from
# role mapping and applies only after confirmed primary-model unavailability.
#
# There is NO deep tier. "Do not use OpenCode for deep-level work" is expressed by
# leaving the tier out: `deep` (and `top`) resolve to the balanced-deep tier and say
# so in their granularity, and the shipped dispatch-defaults.yaml keeps opencode out
# of the deep band and the deep failover list. An explicit request for OpenCode
# (`--owner opencode`, `--pin`) still launches, on the balanced-deep model.

CFG_TIER_BALANCED_DEEP_MODEL=opencode-go/muse-spark-1.3-contributor
CFG_TIER_BALANCED_DEEP_VARIANT=xhigh
CFG_TIER_LIGHT_MODEL=opencode-go/deepseek-v4.1-flash
CFG_TIER_LIGHT_VARIANT=max
CFG_TIER_MINI_MODEL=opencode-go/deepseek-v4.1-flash
CFG_TIER_MINI_VARIANT=high

# --- OpenCode 2 provider eligibility fallbacks. These are consulted only for
# automatic, unpinned selections after the selected provider/account/model has
# confirmed unavailability. OpenAI remains within the existing OAuth policy.
# Zen is excluded from automatic fallback after an observed insufficient-funds
# rejection; paid Zen metered models are not an automatic substitute.
CFG_V2_AUTO_FALLBACKS="openai/gpt-6.1-sol:runtime-default"

# --- Portable execution profiles (tier:variant), SD-88. The variant axis is verified
#     (see header), so light/balanced-deep/mini are separated by variant or model.
#     `deep`, `balanced` and `top` are named collapses onto the tiers this account
#     declares (ADAPTATION §3, CONVENTIONS §1). ---
CFG_MODEL_PROFILE_DEEP=balanced-deep:xhigh
CFG_MODEL_PROFILE_GRANULARITY_DEEP=collapsed-deep-to-balanced-deep
CFG_MODEL_PROFILE_BALANCED_DEEP=balanced-deep:xhigh
CFG_MODEL_PROFILE_BALANCED=light:max
CFG_MODEL_PROFILE_LIGHT=light:max
CFG_MODEL_PROFILE_MINI=mini:high
CFG_MODEL_PROFILE_GRANULARITY=full
CFG_MODEL_PROFILE_GRANULARITY_BALANCED=collapsed-balanced-to-light
# This account has no model above balanced-deep, so the `top` exception profile
# collapses onto that tier and says so in its granularity value. The typed demotion
# is the only honest realization: the profile exists so a route sealed with `top` can
# still run here, not to pretend a bigger model.
CFG_MODEL_PROFILE_TOP=balanced-deep:xhigh
CFG_MODEL_PROFILE_GRANULARITY_TOP=collapsed-top-to-balanced-deep

# --- deep-tier capacity failover (model-granularity), consumed by SD-59
#     capacity_cascade_next: muse-spark exhausted -> deepseek-v4.1-flash. ---
CFG_TIER_DEEP_FAILOVER=light
CFG_TIER_DEEP_FAILOVER_CASCADE="opencode-go/muse-spark-1.3-contributor:xhigh opencode-go/deepseek-v4.1-flash:max"

# --- OpenCode bucket -> tier mapping is retained for non-route role selection.
#     Registered topology never infers a profile from these buckets. ---

# --- Native subagent type catalog (agent-name:portable-profile) ---
# Cross-harness parity with the Claude catalog (same names, same portable
# profiles, resolved through this adapter's CFG_MODEL_PROFILE_* rows by
# sync-native-agents.py, which writes the model only; the registered-launch
# wrapper attaches the variant).
CFG_NATIVE_AGENT_CATALOG="general-purpose:balanced-deep light:light deep:deep balanced:balanced"

# Common requested context operating budget; independent of every model profile.
CFG_MODEL_CONTEXT_WINDOW=800000
