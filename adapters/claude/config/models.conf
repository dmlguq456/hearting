# adapters/claude/config/models.conf
# Claude adapter — the SOLE declaration of concrete Claude model IDs and default
# efforts. model-map.sh, agent frontmatter generation, mem-distill-worker.sh, and
# the README/ADAPTATION model tables all derive from this file. A concrete model
# ID outside this file (and generated regions) is a fail-closed guard violation
# (tools/check-model-config.sh).
#
# This is the shipped release default. The user-effective copy lives at
# <claude-runtime-home>/agent-config/models.conf and is selected whole-file.
# Runtime env vars still override (CLAUDE_MODEL_DEEP/BALANCED,
# CLAUDE_EFFORT_DEEP/BALANCED, CLAUDE_MEM_DISTILL_MODEL*); this file is the
# default source. Model names use Claude short aliases (fable/opus/sonnet/haiku).
# Tuning preference: prefer changing an effort tier over swapping a model tier.

# Interactive-main-only models are telemetry-visible but ineligible for every
# registered headless/native delegated worker surface. Consumers must reject
# explicit or inherited selection rather than silently remap it.
# Fable is main-session-only (2026-09-09 maintainer decision; shipped default = the maintainer's
# runtime). The top model is reserved for the session the user talks to, and
# every owner/worker `deep` runs the next model down at its maximum effort
# (opus/xhigh below) instead. This supersedes the 2026-09-08 mapping that left
# the list empty; the parser requires a nonempty value, and a whitespace-only
# list is how that row said "none" (it splits to [] in every consumer).
CFG_MAIN_SESSION_ONLY_MODELS="fable"
# --- The `top` exception tier (2026-09-09 maintainer decision, second half of the same
#     decision): the main-session-only model is reachable from registered
#     dispatch through exactly one door -- a route that seals the explicit `top`
#     profile on its dispatch-depth-1 owner with a full demand; the wrapper
#     refuses `top` without that route (`profile-top-route-required`) and
#     waives CFG_MAIN_SESSION_ONLY_MODELS for that resolved model only (receipt
#     `model_source=profile-top`); an explicit --model (capacity retry
#     included), a role, a review worker, or a native subagent still cannot
#     name it. No cascade enters or leaves this tier: a top owner that dies of
#     capacity is relaunched by a person, never degraded silently. Effort `max`
#     is the Claude CLI's highest step. ---
CFG_TIER_TOP_MODEL=fable
CFG_TIER_TOP_EFFORT=max

# --- Tiers: concrete model + default effort ---
# --- Concrete tiers. Route-bound execution budgets come from the five portable
#     profiles below; role grouping remains a legacy/direct behavior mapping. ---
CFG_TIER_DEEP_MODEL=opus
CFG_TIER_DEEP_EFFORT=xhigh
CFG_TIER_BALANCED_DEEP_MODEL=opus
CFG_TIER_BALANCED_DEEP_EFFORT=medium
CFG_TIER_LIGHT_MODEL=sonnet
CFG_TIER_LIGHT_EFFORT=medium
# mini rides the LIGHT model at `low`, not a smaller model (2026-08-07 maintainer decision).
# The small tier is discouraged upstream, and mini's only consumers are lifecycle
# helpers whose output later stages read, so a weaker model there costs more
# downstream than the effort step saves. The ladder still moves by effort, never by
# crossing a role onto another tier's model (CONVENTIONS §1).
CFG_TIER_MINI_MODEL=sonnet
CFG_TIER_MINI_EFFORT=low

# Minimal capacity requests use these shipped aliases, independent of worker
# quality profiles. Existing user copies need no new setting.
CFG_CAPACITY_PROBE_MODELS="all:haiku opus:opus sonnet:sonnet"

# --- Portable execution profiles (tier:effort or model/<id>:effort), SD-88. ---
# deep rides the deep tier (opus/xhigh) and balanced-deep its own tier
# (opus/medium). With Fable reserved for the main session, the two deep-side
# profiles share one dispatch-eligible model and separate by EFFORT — the ladder
# this adapter prefers anyway (2026-09-09 maintainer decision).
CFG_MODEL_PROFILE_DEEP=deep:xhigh
CFG_MODEL_PROFILE_BALANCED_DEEP=balanced-deep:medium
CFG_MODEL_PROFILE_BALANCED=light:high
CFG_MODEL_PROFILE_LIGHT=light:medium
CFG_MODEL_PROFILE_MINI=mini:low
CFG_MODEL_PROFILE_GRANULARITY=full
# top is opt-in: a user copy that omits this row has no top profile (typed
# `profile-top-undeclared`), and its TIER_TOP keys are then unreferenced.
CFG_MODEL_PROFILE_TOP=top:max
CFG_MODEL_PROFILE_GRANULARITY_TOP=full

# --- deep-tier capacity failover (model-granularity). A rate-limited model does
#     not recover by lowering effort, so the dispatch-eligible cascade switches
#     MODEL: opus -> sonnet. Fable is absent because it is main-session-only.
#     Each step carries its own paired effort; the sonnet step runs `high` rather
#     than the light tier's default `medium` to hold quality on failover.
#     Consumed by SD-59 (utilities/stage-dispatch-fallback.py capacity_cascade_next)
#     when a dispatch worker dies dead-capacity and no explicit --capacity-model
#     is passed. Effort-first (quality tuning) is separate from this. ---
# The scalar names the failover TIER (light = sonnet/medium) and is read only to
# decide which tier keys a user copy must declare (model_config.TIER_REFERENCE_KEYS).
# The cascade below carries the effort actually used on failover, and it deliberately
# differs: `sonnet:high`, not the light tier's `medium`. Same model, two operating
# points, two keys — do not read one as the other.
CFG_TIER_DEEP_FAILOVER=light
CFG_TIER_DEEP_FAILOVER_CASCADE="opus:xhigh sonnet:high"

# --- Lifecycle helper tiers ---
CFG_LIFECYCLE_NUDGE=mini      # reserved lifecycle tier reference (no current caller; sonnet@low)
CFG_LIFECYCLE_CURATE=light    # reserved lifecycle tier reference (no current caller; sonnet@medium)

# --- Native subagent default tier (Agent/Task tool spawns) ---
# Native subagents no longer silently inherit the interactive session model:
# hooks/subagent-model-default.sh (PreToolUse Agent|Task) injects this tier's
# model into tool_input. An explicit eligible per-invocation model or eligible
# agent-definition pin wins. Fork/inherit selection and every model named by
# CFG_MAIN_SESSION_ONLY_MODELS are denied before spawn. Runtime env
# CLAUDE_NATIVE_SUBAGENT_MODEL=<eligible-alias> may force another injected model.
# With the catalog below, every cataloged type carries its own definition-file
# pin, so this tier only reaches residual un-cataloged spawns.
CFG_NATIVE_SUBAGENT=light

# --- Native subagent type catalog (agent-name:portable-profile) ---
# Consumed by adapters/claude/bin/sync-native-agents.py, which resolves each
# portable profile through utilities/model_profile.py and generates the
# agent-definition files under adapters/claude/agents/ (ADAPTATION §3
# "generated agent" derivation). The definition file pins model AND effort
# together — the Agent tool input schema has no effort field, so a definition
# pin is the only surface that can fix effort. `general-purpose` deliberately
# shadows the runtime built-in of the same name: user-scope definitions
# override built-ins, which is how un-typed spawns get balanced-deep instead
# of inheriting the interactive session's effort (maintainer decision 2026-07-29).
CFG_NATIVE_AGENT_CATALOG="general-purpose:balanced-deep light:light deep:deep balanced:balanced"

# --- Role -> tier grouping (Claude's existing grouping; model-map.sh keeps the
#     same case routing). Note: differs from codex on purpose — Claude's
#     external adversary is a light wrapper that invokes the external engine. ---
CFG_ROLES_DEEP="deep maker|deep reviewer|deep editor|deep orchestrator"
CFG_ROLES_LIGHT="fast implementer|fast reviewer|fast fact checker|fast writer|fast tool worker|orchestrator|external adversary|external adversary orchestrator"

# Common requested context operating budget; independent of every model profile.
CFG_MODEL_CONTEXT_WINDOW=800000
