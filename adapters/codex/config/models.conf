# adapters/codex/config/models.conf
# Codex adapter — the SOLE declaration of concrete Codex model IDs and default
# reasoning efforts. model-map.sh, sync-native-agents.py, agents/*.toml,
# distill-worker.sh, and the README/ADAPTATION model tables all derive from this
# file. A concrete model ID that appears outside this file (and generated
# regions) is a fail-closed guard violation (tools/check-model-config.sh).
#
# This is the shipped release default. The user-effective copy lives at
# <codex-runtime-home>/agent-config/models.conf and is selected whole-file.
# Runtime env vars still override (CODEX_MODEL_SOL/LUNA/BALANCED,
# CODEX_REASONING_*); this file is the default source, not a hard pin.
# Format: POSIX-sh-sourceable flat KEY=value — sourced by sh, parsed by python.
# Tuning preference: prefer changing an effort tier over swapping a model tier.

# --- Tiers: concrete model + default reasoning effort ---
# --- Concrete tiers. Route-bound execution budgets come from the five portable
#     profiles below; role grouping remains a legacy/direct behavior mapping. ---
# The deep tier is Sol, not Astra. Astra is main-session-only (2026-09-09 사용자
# 결정): the top model is reserved for the session the user talks to, and every
# owner/worker `deep` runs the next model down at its maximum effort.
#
# Enforced here since 2026-09-10 with the same key the Claude adapter declares:
# adapters/codex/bin/dispatch-headless.py refuses an explicit `--model` or a
# role mapping that names a main-only model (`headless-main-session-only-model`),
# through the one matcher in utilities/model_config.py (a whole id such as
# `gpt-6-astra` or a bare alias token). A user copy that omits this key stays
# selected whole-file (utilities/model_config.py OPTIONAL_POLICY_KEYS) and
# carries no restriction, which the receipt shows as
# `main_session_only_policy=absent` -- the key was absent from every codex copy
# before this date. The one door to
# Astra from registered dispatch is the `top` exception profile below.
# `--inherit-model-settings` is refused outright (parity with Claude,
# 2026-09-10) and is off this adapter's documented dispatch surface: no
# headless launch can prove the inherited interactive settings exclude Astra.
# The managed interactive boundary does not use this wrapper.
CFG_MAIN_SESSION_ONLY_MODELS="gpt-6-astra"
# --- The `top` exception tier: Astra at its highest reasoning effort, reachable
#     only from a route that seals the explicit `top` profile on a dispatch-
#     depth-1 owner (see the Claude adapter's note). No cascade enters or
#     leaves it, and no headless launch may `--inherit-model-settings`. ---
CFG_TIER_TOP_MODEL=gpt-6-astra
CFG_TIER_TOP_EFFORT=xhigh
CFG_TIER_DEEP_MODEL=gpt-6-sol
CFG_TIER_DEEP_EFFORT=xhigh
CFG_TIER_LIGHT_MODEL=gpt-5.6-luna
CFG_TIER_LIGHT_EFFORT=medium
# mini rides the LIGHT model at `low`, not a smaller model (2026-08-07 사용자 결정,
# mirrors the Claude adapter). The small tier is discouraged upstream, and mini's only
# consumers are lifecycle helpers whose output later stages read, so a weaker model
# there costs more downstream than the effort step saves. The ladder still moves by
# effort, never by crossing a role onto another tier's model (CONVENTIONS §1).
CFG_TIER_MINI_MODEL=gpt-5.6-luna
CFG_TIER_MINI_EFFORT=low

# --- Portable execution profiles (tier:reasoning), SD-88. ---
# Both deep-side profiles ride the deep tier (Sol) and separate by EFFORT:
# deep = xhigh, balanced-deep = medium. There is no second deep-side MODEL here
# because Astra sits above the tier and is main-session-only (2026-09-09).
CFG_MODEL_PROFILE_DEEP=deep:xhigh
CFG_MODEL_PROFILE_BALANCED_DEEP=deep:medium
CFG_MODEL_PROFILE_BALANCED=light:high
CFG_MODEL_PROFILE_LIGHT=light:medium
CFG_MODEL_PROFILE_MINI=mini:low
CFG_MODEL_PROFILE_GRANULARITY=full
# top is opt-in: a user copy that omits this row has no top profile.
CFG_MODEL_PROFILE_TOP=top:xhigh
CFG_MODEL_PROFILE_GRANULARITY_TOP=full

# --- Per-role overrides: NONE by design (2026-07-22 사용자 원칙, supersedes the
#     2026-07-21 fast-implementer=deep@medium special case). Tier ladder is fixed
#     (deep > light > mini); an intermediate performance point ("2.5") is made by
#     adjusting the tier's EFFORT, never by crossing a role onto another tier's
#     model. Implementation quality is carried by the pipeline (deep plan +
#     unconditional plan-check), so fast implementer rides the light tier. ---

# --- deep-tier capacity failover (model-granularity): SOL exhausted -> LUNA.
#     Consumed by SD-59 capacity_cascade_next when no explicit --capacity-model. ---
CFG_TIER_DEEP_FAILOVER=light
CFG_TIER_DEEP_FAILOVER_CASCADE="gpt-6-sol:xhigh gpt-5.6-luna:medium"

# --- Lifecycle helper tiers ---
CFG_LIFECYCLE_NUDGE=mini      # turn-nudge / increment distill
CFG_LIFECYCLE_CURATE=light    # session-end curate distill

# --- Role -> tier grouping (consumed by sync-native-agents.py; model-map.sh
#     keeps the same grouping in its case routing). Pipe-separated role names. ---
CFG_ROLES_DEEP="deep maker|deep reviewer|deep editor|deep orchestrator|external adversary"
CFG_ROLES_LIGHT="orchestrator|external adversary orchestrator|fast implementer|fast reviewer|fast fact checker|fast writer|fast tool worker"

# --- Native agent profiles: tier:effort:sandbox (sync-native-agents.py derives
#     the concrete model from the tier; effort/sandbox are per-profile). ---
CFG_PROFILE_EXTERNAL_ADVERSARY=deep:high:read-only
CFG_PROFILE_MEMORY_SCOUT=light:low:read-only
CFG_PROFILE_DEFAULT=light:medium:workspace-write

# --- Native subagent type catalog (agent-name:portable-profile) ---
# Cross-harness parity with the Claude catalog (same names, same portable
# profiles, resolved through this adapter's CFG_MODEL_PROFILE_* rows by
# sync-native-agents.py; sandbox is workspace-write for all catalog types).
CFG_NATIVE_AGENT_CATALOG="general-purpose:balanced-deep light:light deep:deep balanced:balanced"
