# dispatch-defaults.yaml — SD-66 user-declared harness defaults.
#
# This is the sole user-facing surface for stage 3 (stage affinity) of the
# SD-22 selector cascade in core/OPERATIONS.md §5.10: explicit --adapter /
# --family and hard eligibility (usage limits, runtime/account support)
# always win over any value here; the orchestrator may still deviate from a
# configured affinity when it records a reason (this file is a soft default,
# never a pin); any cell this file omits stays fully discretionary under the
# existing neutral/bias behavior. Parsed and validated only by
# utilities/dispatch-defaults.py — no PyYAML/yq dependency.
#
# Schema (narrow subset, parsed by utilities/dispatch-defaults.py):
#   schema_version: 4
#   harnesses:
#     enabled: [<harness>, ...]
#   profiles:
#     <profile>:
#       primary: [<quality peers>]
#       relief: [<lower-band relief candidates>]
#       last_resort: [<last-resort candidates>]
#       promote_relief_below: <0..100 headroom percent>
#   allocation:
#     strategy: balanced
#     window: 30                       # last exact registered attempts
#     usage_gate_used_percent: 85
#     depth_affinity: {owner: claude, worker: codex}
#     depth_affinity_weight: 0.65
#     owner_order: [claude, opencode, codex] # v3/v4; owners only, within eligibility/band
#     usage_headroom_exponent: 2
#     harness_weights:                 # optional; block mapping only (an inline
#       opencode: 0.3                  # {a: 1} map is not parsed); 0 < w <= 1,
#                                      # default 1.0; `balanced` strategy only
#   confirmation:                      # SD-123: post-frame direction gate
#     mode: hybrid                     # hybrid | both | post-frame-only
#   steward:                           # SD-122 (9): peer-session steward
#     child_permission_mode: bypass    # bypass | inherit
#     check_interval_seconds: 7200     # periodic steward check, 600..86400
#     max_supervisors_per_repo: 2      # new steward grants per repository, 1..8
#   capabilities:
#     <capability-name>:
#       <canonical-topology-node-id>: <claude|codex|opencode|diverse>
#   headless:
#     claude_permission_mode: bypass   # bypass | allowlist
#     no_progress_minutes: 30          # launcher quiet window; 0 disables; clamps to 0..1440
#   worker_account:                     # optional schema v4 auth-source paths
#     claude: ~/.claude-work           # Claude config directory
#     codex: ~/.codex-work             # CODEX_HOME; auth.json only is selected
#     opencode: ~/.local/share         # XDG_DATA_HOME; opencode/auth.json only
#
# The profile bands, quality-peer pairing and harness names below are
# recommendations, not walls: a file that breaks one (a band naming a disabled
# harness, OpenCode in a deep band, an OpenCode-only setup, ...) is still read as
# written and the validator prints a `warning=` line. Only structural damage
# (unknown keys, bad types or ranges) rejects the file. Leaving a harness out of a
# profile means "do not use it for this profile".
#
# Value vocabulary for a capability/stage cell: claude | codex | opencode |
# diverse (rank the checked pool by the sealed allocation policy) |
# unspecified (omit the key — orchestrator discretion). Harness names only —
# never a concrete model id or reasoning/effort value; that stays owned by
# the adapter model-map contract (SD-22 family/role split).

schema_version: 4

harnesses:
  enabled: [claude, codex, opencode]

# Capacity reorders only within a band. OpenCode is not a quality peer of the
# two primary harnesses: it is left out of `deep` entirely (2026-09-30: OpenCode
# is not used for deep-level work, so `deep` lists no OpenCode and neither does
# its failover), holds only a last-resort seat for balanced-deep and balanced, and
# is a peer for light/mini work, where its low `harness_weights` share below keeps
# the slower runtime from taking an even third of the default placements.
profiles:
  deep:
    primary: [claude, codex]
    relief: []
    last_resort: []
    promote_relief_below: 0
  balanced-deep:
    primary: [claude, codex]
    relief: []
    last_resort: [opencode]
    promote_relief_below: 0
  balanced:
    primary: [claude, codex]
    relief: []
    last_resort: [opencode]
    promote_relief_below: 0
  light:
    primary: [claude, codex, opencode]
    relief: []
    last_resort: []
    promote_relief_below: 0
  mini:
    primary: [claude, codex, opencode]
    relief: []
    last_resort: []
    promote_relief_below: 0

# Read-only allocation telemetry counts the last 30 exact registered attempt
# rows in the selected canonical jobs.log. `balanced` blends that count with
# fresh gauge headroom in one continuous key: headroom sets each peer's target
# share of the next attempt, the recent count says how much it already used.
# Equal headroom therefore reduces to exact round-robin. `usage_gate_used_percent`
# stays the existing hard gate-class/demotion boundary, not the sole ordering
# signal; typed hard eligibility and explicit selection keep their precedence.
allocation:
  strategy: balanced
  window: 30
  usage_gate_used_percent: 85
  depth_affinity:
    owner: claude
    worker: codex
  depth_affinity_weight: 0.85
  usage_headroom_exponent: 2
  # OpenCode is slow: every enabled harness is a worker candidate, but it takes a
  # smaller target share of default placements (`balanced` strategy). Explicit
  # selection, pins and hard eligibility ignore this.
  # 2026-09-30 (maintainer decision): weights only lower a share (at most 1),
  # so Claude takes half the default share and Codex gets about twice as many
  # default placements; workers lean further to Codex through depth affinity.
  harness_weights:
    claude: 0.5
    opencode: 0.3

# Registered headless permission posture (core/OPERATIONS.md §5.10). Hearting-
# launched Claude workers and owners are unattended `claude -p` turns; without a
# pinned start mode they inherit the runtime default (`auto` plus the permission
# classifier when the settings template's `permissions.defaultMode: auto` is
# inherited) and a run of classifier denials kills the owner with no typed
# cause. `bypass` pins `--permission-mode bypassPermissions`; `allowlist` pins
# `--permission-mode acceptEdits` and pre-approves only what a worker needs
# (harness utilities, read-only git, test runners, Edit inside the worktree and
# artifact root) through `--allowedTools`. The wrapper falls back to `allowlist`
# on its own where bypass cannot apply (root/sudo, permissions.disableBypassPermissionsMode
# in any settings scope)
# and records the applied posture in the attempt row (`permission_mode=`,
# `permission_mode_reason=`). Omitting the section selects `bypass`.
headless:
  claude_permission_mode: bypass
  no_progress_minutes: 30

# SD-123: standard+ two-stage confirmation for the post-frame direction gate.
# hybrid keeps the existing pre-plan notify plus the new post-frame gate;
# both requires an explicit release at each stage; post-frame-only drops the
# pre-plan notify and gates only after the frame.
confirmation:
  mode: hybrid
  # SD-136: user-authored small-work turns use the card; existing peer
  # envelopes use one `[경로]` notice (stewards cannot approve for the user).
  # Destructive or external-facing work keeps the card in either case.
  small_work: notice

# SD-122 (9): default permission mode `peer-steward.py start` applies to a
# newly started child session. `bypass` prepends the per-runtime bypass flag
# verbatim; `inherit` is the opt-out (prepends nothing).
steward:
  child_permission_mode: bypass
  # Periodic steward check through the shared obligation runner (seconds, 600-86400).
  check_interval_seconds: 7200
  # New steward grants per repository (linked worktrees fold to the primary), 1-8.
  max_supervisors_per_repo: 2

capabilities:
  # autopilot-code: canonical topology node ids are frame, plan, plan-check,
  # execute, impl-review, test, report (capabilities/topologies.json v5).
  # PRD prose names "exec"/"review"; execute below realizes prose "exec" and
  # test realizes the final verification stage. All stages keep `diverse`
  # affinity, then their model profile selects the quality band above. Exact
  # route evidence and task-specific explicit choices still outrank this soft default.
  # A literal exec/review key fails validation against the topology registry.
  # Parallel leg ids are compile-time expansions, not config keys. The batch
  # places a group across at least two harness families when available; the
  # route independently seals each leg's profile and perspective.
  autopilot-code:
    frame: diverse
    plan: diverse
    plan-check: diverse
    execute: diverse
    impl-review: diverse
    test: diverse
    report: diverse

  # Coordinate inventory for other registered capabilities. All left
  # commented (parse-neutral scaffold, not empty keys) — no default is
  # shipped for these yet. Uncomment and set a value only after the same
  # spec/PRD review this file's autopilot-code defaults went through.
  # autopilot-apply:
  #   apply:
  #   verify:
  #   handback:
  # autopilot-design:
  #   refs:            # parallel framing group (width 2 from standard)
  #   build:
  #   visual-verify:
  #   critic-review:
  #   handoff:
  # autopilot-draft:
  #   material-strategy:  # parallel framing group (width 2 from standard)
  #   strategy-review:
  #   draft-production:
  #   quality-review:
  #   fact-verify:
  #   finalize:
  # autopilot-lab:
  #   scaffold:
  #   smoke:
  #   full-run:
  #   eval-run:
  #   metrics:
  #   media:
  #   report:
  #   independent-verify:
  #   sync:
  # autopilot-note:
  #   scan:
  #   route-apply:
  # autopilot-refine:
  #   review:
  #   transaction:
  # autopilot-research:
  #   retrieval:       # parallel framing group (width 2 from standard)
  #   synthesis:
  #   report:
  #   claim-verify:
  # autopilot-ship:
  #   release-setup:
  #   security-review:
  #   release-review:
  # autopilot-spec:
