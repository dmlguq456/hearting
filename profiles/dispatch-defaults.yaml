# dispatch-defaults.yaml — SD-66 user-declared harness defaults.
#
# This is the sole user-facing surface for stage 3 (stage affinity) of the
# SD-22 selector cascade in core/OPERATIONS.md §5.10: explicit --adapter /
# --family and hard eligibility (usage limits, runtime/account support)
# always win over any value here; the orchestrator may still deviate from a
# configured affinity when it records a reason (this file is a soft default,
# never a pin); any cell this file omits stays fully discretionary under the
# existing neutral/bias behavior. Parsed and validated only by
# utilities/dispatch-defaults.py — no PyYAML/yq dependency.
#
# Schema (narrow subset, parsed by utilities/dispatch-defaults.py):
#   schema_version: 3
#   harnesses:
#     enabled: [<harness>, ...]
#   profiles:
#     <profile>:
#       primary: [<quality peers>]
#       relief: [<lower-band relief candidates>]
#       last_resort: [<last-resort candidates>]
#       promote_relief_below: <0..100 headroom percent>
#   allocation:
#     strategy: capacity-aware
#     window: 30                       # last exact registered attempts
#   capabilities:
#     <capability-name>:
#       <canonical-topology-node-id>: <claude|codex|opencode|diverse>
#
# Value vocabulary for a capability/stage cell: claude | codex | opencode |
# diverse (rank the checked pool by the sealed allocation policy) |
# unspecified (omit the key — orchestrator discretion). Harness names only —
# never a concrete model id or reasoning/effort value; that stays owned by
# the adapter model-map contract (SD-22 family/role split).

schema_version: 3

harnesses:
  enabled: [claude, codex, opencode]

# Capacity reorders only within a band. OpenCode is not a quality peer of the
# two primary harnesses: deep work reaches it only as a last resort, while
# light/mini work may promote it when both primary gauges are genuinely tight.
profiles:
  deep:
    primary: [claude, codex]
    relief: []
    last_resort: [opencode]
    promote_relief_below: 0
  balanced-deep:
    primary: [claude, codex]
    relief: []
    last_resort: [opencode]
    promote_relief_below: 0
  light:
    primary: [claude, codex]
    relief: [opencode]
    last_resort: []
    promote_relief_below: 35
  mini:
    primary: [claude, codex]
    relief: [opencode]
    last_resort: []
    promote_relief_below: 35

# Read-only allocation telemetry counts the last 30 exact registered attempt
# rows in the selected canonical jobs.log. Fresh runtime gauges order quality
# peers first; recent exact attempts break unknown/equal-capacity ties.
allocation:
  strategy: capacity-aware
  window: 30

capabilities:
  # autopilot-code: canonical topology node ids are frame, plan, plan-check,
  # execute, impl-review, test, report (capabilities/topologies.json v5).
  # PRD prose names "exec"/"review"; execute below realizes prose "exec" and
  # test realizes the final verification stage. All stages keep `diverse`
  # affinity, then their model profile selects the quality band above. Exact
  # route evidence and task-specific explicit choices still outrank this soft default.
  # A literal exec/review key fails validation against the topology registry.
  # Parallel leg ids are compile-time expansions, not config keys. The batch
  # places a group across at least two harness families when available; the
  # route independently seals each leg's profile and perspective.
  autopilot-code:
    frame: diverse
    plan: diverse
    plan-check: diverse
    execute: diverse
    impl-review: diverse
    test: diverse
    report: diverse

  # Coordinate inventory for other registered capabilities. All left
  # commented (parse-neutral scaffold, not empty keys) — no default is
  # shipped for these yet. Uncomment and set a value only after the same
  # spec/PRD review this file's autopilot-code defaults went through.
  # autopilot-apply:
  #   apply:
  #   verify:
  #   handback:
  # autopilot-design:
  #   refs:            # parallel framing group (width 2 from standard)
  #   build:
  #   visual-verify:
  #   critic-review:
  #   handoff:
  # autopilot-draft:
  #   material-strategy:  # parallel framing group (width 2 from standard)
  #   strategy-review:
  #   draft-production:
  #   quality-review:
  #   fact-verify:
  #   finalize:
  # autopilot-lab:
  #   scaffold:
  #   smoke:
  #   full-run:
  #   eval-run:
  #   metrics:
  #   media:
  #   report:
  #   independent-verify:
  #   sync:
  # autopilot-note:
  #   scan:
  #   route-apply:
  # autopilot-refine:
  #   review:
  #   transaction:
  # autopilot-research:
  #   retrieval:       # parallel framing group (width 2 from standard)
  #   synthesis:
  #   report:
  #   claim-verify:
  # autopilot-ship:
  #   release-setup:
  #   security-review:
  #   release-review:
  # autopilot-spec:
