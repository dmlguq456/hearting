name: Release

on:
  push:
    tags:
      - "v*"
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admission:
    # A failed or superseded (cancelled) Checks run is not a release candidate;
    # skip instead of failing so it does not raise a second failure notice.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      head: ${{ steps.gate.outputs.head }}
      validation_required: ${{ steps.gate.outputs.validation_required }}
    steps:
      # workflow_run's github.sha is the trusted default-branch revision,
      # not the candidate revision. Do not execute candidate code to admit it.
      - name: Check out the admission policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Admit the exact release commit
        id: gate
        run: python3 tools/release/validation-gate.py >> "$GITHUB_OUTPUT"

  validation:
    needs: admission
    if: needs.admission.outputs.validation_required == 'true'
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
      # The called Checks job looks up PR validation through the Actions API; a
      # caller cannot grant a called job more than it holds itself.
      actions: read

  release:
    needs: [admission, validation]
    if: >-
      always() && !cancelled() && needs.admission.result == 'success' &&
      (needs.admission.outputs.validation_required == 'false' ||
      (needs.admission.outputs.validation_required == 'true' && needs.validation.result == 'success'))
    runs-on: ubuntu-latest
    # Only admitted releases enter serialization. A failed Checks event must
    # never evict a successful release from GitHub's one-pending-run queue.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out the release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.admission.outputs.head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the checked out commit
        env:
          RELEASE_HEAD: ${{ needs.admission.outputs.head }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_HEAD"

      - name: Plan release
        id: plan
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_HEAD: ${{ needs.admission.outputs.head }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A delayed tested commit can predate this policy. Read the planner
          # from the workflow's pinned revision without changing asset source.
          task_release_plan="$RUNNER_TEMP/hearting-release-plan.py"
          git show "$GITHUB_WORKFLOW_SHA:tools/release/plan.py" > "$task_release_plan"
          python3 "$task_release_plan" prepare \
            --repo . \
            --head "$RELEASE_HEAD" \
            --format github >> "$GITHUB_OUTPUT"

      - name: Report skipped release
        if: steps.plan.outputs.release != 'true'
        env:
          BASE_TAG: ${{ steps.plan.outputs.base_tag }}
          REASON: ${{ steps.plan.outputs.reason }}
        run: |
          {
            echo "## Release skipped"
            echo
            echo "Baseline: \`$BASE_TAG\`; reason: \`$REASON\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # Checks already validated this exact commit. Build and test the published
      # package below; do not repeat its source/install suites here.
      - name: Build deterministic release assets
        if: steps.plan.outputs.release == 'true'
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.version }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_REF: ${{ needs.admission.outputs.head }}
        run: |
          python3 tools/install/build-release.py \
            --version "$RELEASE_TAG" \
            --repository "$RELEASE_REPOSITORY" \
            --ref "$RELEASE_REF" \
            --output dist

      - name: Publish the verified release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.plan.outputs.version }}
        run: |
          set --
          case "$RELEASE_TAG" in
            *-*) set -- --prerelease ;;
          esac
          gh release create "$RELEASE_TAG" \
            dist/hearting.tar.gz \
            dist/hearting.tar.gz.sha256 \
            dist/install.sh \
            dist/install.sh.sha256 \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TAG" \
            "$@"

      - name: Smoke test the published release
        if: steps.plan.outputs.release == 'true'
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.plan.outputs.version }}
        run: ./tools/release/post-publish-smoke.sh "$GITHUB_REPOSITORY" "$RELEASE_TAG"

      - name: Summarize release
        if: steps.plan.outputs.release == 'true'
        env:
          BASE_TAG: ${{ steps.plan.outputs.base_tag }}
          BUMP: ${{ steps.plan.outputs.bump }}
          RELEASE_TAG: ${{ steps.plan.outputs.version }}
          REASON: ${{ steps.plan.outputs.reason }}
        run: |
          {
            echo "## Released \`$RELEASE_TAG\`"
            echo
            echo "- Previous stable: \`${BASE_TAG:-manual tag}\`"
            echo "- Bump: \`$BUMP\`"
            echo "- Reason: \`$REASON\`"
          } >> "$GITHUB_STEP_SUMMARY"
