name: Checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # A release's called Checks must not cancel an ordinary Checks run.
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adaptation-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # ci_scope.py asks the Actions API whether a PR run already passed this tree.
      actions: read
    outputs:
      full_tests: ${{ steps.scope.outputs.full_tests }}
    steps:
      - name: Check out the source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select checks for the changed files
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/ci_scope.py >> "$GITHUB_OUTPUT"

      - name: Record the scope decision
        env:
          FULL_TESTS: ${{ steps.scope.outputs.full_tests }}
          SCOPE_REASON: ${{ steps.scope.outputs.reason }}
        run: |
          echo "Expensive suites: full_tests=$FULL_TESTS (reason: $SCOPE_REASON)" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify generated projections
        run: python3 tools/generate.py --check

      - name: Verify the published landing surface
        run: python3 tools/render-landing.py --check

      - name: Verify adaptation boundary
        run: ./tools/check-adaptation-boundary.sh

      - name: Verify model-config single source
        run: python3 tools/check-model-config.py

      - name: Verify unit-catalog contract
        run: python3 tools/check-unit-config.py

      - name: Verify scope placeholder vocabulary
        run: python3 tools/check-scope-placeholders.py

  install-lifecycle:
    needs: adaptation-boundary
    if: needs.adaptation-boundary.outputs.full_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run launcher binding suites
        run: |
          python3 tools/install/codex_launcher.test.py
          python3 utilities/codex_launcher.test.py

      - name: Verify destructive mutation safety
        run: |
          python3 tools/install/check_destructive_calls.py tools/install
          python3 tools/install/test_destructive_guard.py
          python3 tools/install/test_fixture_env.py
          python3 tools/install/test_safe_fs.py
          python3 tools/install/test_distribution_safe.py
          python3 tools/install/deletion_safety.test.py
          python3 tools/install/route_release_retention.test.py
          python3 tools/install/installer_runtime.test.py

      - name: Run activation and lifecycle suites
        run: |
          python3 utilities/codex_tui_config.test.py
          python3 tools/install/runtime_activation.test.py
          ./tools/install/runtime-activation.test.sh
          ./tools/install/release-lifecycle.test.sh
          ./tools/install/extension-lifecycle.test.sh

      - name: Check the installed-layout regression trigger (C-4)
        run: python3 tools/check-installed-layout-trigger.py --base HEAD~1 --head HEAD

  dispatch-pid-namespace:
    needs: adaptation-boundary
    if: needs.adaptation-boundary.outputs.full_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install PID namespace fixture
        run: |
          bash tools/release/install-ci-fixtures.sh bubblewrap
          # Ubuntu 24.04 runners confine unprivileged user namespaces via
          # AppArmor, so bwrap dies with "setting up uid map: Permission
          # denied" before the suite starts.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Verify Codex detached receipt and marker ordering
        env:
          HEARTING_REQUIRE_PIDNS: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 utilities/dispatch_namespace_e2e.test.py -v

      - name: Run pinned native Codex permission-profile tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          work="$(mktemp -d "${RUNNER_TEMP}/hearting-codex-cli.XXXXXX")"
          mkdir -m 700 "$work/bin" "$work/unpacked"
          archive="$work/codex-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 300 \
            --connect-timeout 20 --max-time 240 \
            --output "$archive" \
            https://github.com/openai/codex/releases/download/rust-v0.163.0/codex-x86_64-unknown-linux-musl.tar.gz
          printf '%s  %s\n' \
            beb339e8ecd9ba057a6bb2dc81ad8ca474812edfbf0fc5056ca818797648dde4 \
            "$archive" | sha256sum --check --strict
          tar --no-same-owner -xzf "$archive" -C "$work/unpacked"
          executable="$(find "$work/unpacked" -type f \
            \( -name codex -o -name codex-x86_64-unknown-linux-musl \) \
            -print -quit)"
          test -n "$executable"
          install -m 700 "$executable" "$work/bin/codex"
          version="$("$work/bin/codex" --version)"
          printf 'Pinned native test CLI: %s\n' "$version"
          case "$version" in
            *0.163.0*) ;;
            *) echo "Expected Codex CLI 0.163.0, got: $version" >&2; exit 1 ;;
          esac
          PATH="$work/bin:$PATH" python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          import sys
          import unittest

          test_path = Path("utilities/codex_permission_profile.test.py").resolve()
          sys.path.insert(0, str(test_path.parent))
          spec = importlib.util.spec_from_file_location("codex_permission_profile_ci_tests", test_path)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          suite = unittest.defaultTestLoader.loadTestsFromModule(module)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          skipped_native = [test.id() for test, _ in result.skipped if ".test_native_" in test.id()]
          if skipped_native:
              print("Native permission measurements were skipped: " + ", ".join(skipped_native), file=sys.stderr)
          sys.exit(0 if result.wasSuccessful() and not skipped_native else 1)
          PY

  full-suite-shard:
    needs: adaptation-boundary
    if: needs.adaptation-boundary.outputs.full_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # Every shard reports even when a sibling fails, so one run shows all causes.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Check out the source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install full-suite tracing fixtures
        run: bash tools/release/install-ci-fixtures.sh ripgrep strace

      - name: Run shard ${{ matrix.shard }} of the full isolated test suite (C-3/C-4)
        timeout-minutes: 35
        # --seed-baseline uploads the proposed rows stamped with this runner's
        # fingerprint; adopting them is a human decision, never automatic.
        # A known failure that now passes is reported, not failed: a fix
        # should not turn the build red until its baseline row is dropped.
        # The shard is split from tools/test-durations.tsv, so every runner
        # computes the same partition; --suite-list is written before any
        # suite runs and lets the aggregate job prove nothing was dropped.
        run: |
          set -o pipefail
          mkdir -p "${{ runner.temp }}/shard-out"
          observe_claude() {
            HEARTING_CLAUDE_OBSERVATION="$1" PYTHONPATH=utilities python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from claude_process_identity import (
              _EMBEDDED_HELPERS, _claude_shaped_argv, _native_claude_executable,
              _runtime_identity, claude_session_census,
          )

          root = Path("/proc")
          try:
              namespace = os.readlink(root / "self" / "ns" / "pid")
          except OSError as exc:
              namespace = f"unavailable:{type(exc).__name__}"
          targets = 0
          unresolved = 0
          for item in root.iterdir():
              if not item.name.isdecimal():
                  continue
              try:
                  identity = _runtime_identity(item)
              except OSError:
                  unresolved += 1
                  continue
              if identity is None:
                  continue
              process_uid, _start, argv, executable = identity
              native_exe = bool(executable and _native_claude_executable(executable))
              argv0 = os.path.basename(argv[0]).lower() if argv else ""
              if process_uid != os.getuid():
                  if _claude_shaped_argv(argv):
                      targets += 1
                  continue
              if native_exe and argv0 in _EMBEDDED_HELPERS:
                  continue
              if native_exe and not _claude_shaped_argv(argv):
                  unresolved += 1
                  continue
              if native_exe or _claude_shaped_argv(argv):
                  targets += 1
          complete, holders, reasons = claude_session_census()
          print(json.dumps({
              "observation": os.environ["HEARTING_CLAUDE_OBSERVATION"],
              "pid_namespace": namespace,
              "complete": complete,
              "holders": sorted(holders),
              "reasons": sorted(reasons),
              "claude_target_inventory": {"count": targets, "unresolved": unresolved},
          }, sort_keys=True))
          PY
          }
          if [ "${{ matrix.shard }}" = "1" ]; then
            observe_claude focused-before | tee "${{ runner.temp }}/shard-out/focused-before.log"
            focused_status=0
            python3 tools/run-tests.py --retries 0 \
              --select hooks/peer_steward_rewake.test.py \
              --select utilities/peer_runner_lifecycle.test.py \
              --select utilities/peer_obligations.test.py \
              --select utilities/peer_steward.test.py \
              --select utilities/recipient_lifetime.test.py \
              --select utilities/dispatch_registry_cache.test.py \
              --select hooks/peer_message_record.test.py \
              --select utilities/dispatch_lifecycle.test.py \
              --report "${{ runner.temp }}/shard-out/focused-report.tsv" \
              --diagnostics-dir "${{ runner.temp }}/shard-out/focused-diagnostics" \
              2>&1 | tee "${{ runner.temp }}/shard-out/focused-progress.log" || focused_status=$?
            observe_claude focused-after | tee "${{ runner.temp }}/shard-out/focused-after.log"
            if [ "$focused_status" -ne 0 ]; then exit "$focused_status"; fi
          fi
          observe_claude full-suite-before | tee "${{ runner.temp }}/shard-out/progress.log"
          python3 tools/run-tests.py --retries 1 \
            --shard ${{ matrix.shard }}/8 \
            --suite-list ${{ runner.temp }}/shard-out/suite-list.tsv \
            --xpass-nonfatal \
            --strict-leak-sweep \
            --report ${{ runner.temp }}/shard-out/run-tests-report.tsv \
            --diagnostics-dir ${{ runner.temp }}/shard-out/run-tests-diagnostics \
            --seed-baseline ${{ runner.temp }}/shard-out/run-tests-seed-baseline.tsv \
            2>&1 | tee -a "${{ runner.temp }}/shard-out/progress.log"

      - name: Upload shard report, manifest and baseline seed
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: run-tests-report-shard-${{ matrix.shard }}-of-8-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shard-out
          if-no-files-found: ignore

  # The required check keeps its historical name; it now means "every shard ran
  # and together they cover the whole census".
  full-test-suite:
    name: full-test-suite
    needs: [adaptation-boundary, full-suite-shard]
    if: always() && needs.adaptation-boundary.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every shard to have succeeded
        if: needs.adaptation-boundary.outputs.full_tests == 'true'
        env:
          SHARDS: ${{ needs.full-suite-shard.result }}
        run: |
          if [ "$SHARDS" != success ]; then
            echo "full-suite-shard result is '$SHARDS'; shard reports are in the run artifacts" >&2
            exit 1
          fi

      - name: Check out the source
        if: needs.adaptation-boundary.outputs.full_tests == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the shard reports
        if: needs.adaptation-boundary.outputs.full_tests == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: run-tests-report-shard-*
          path: ${{ runner.temp }}/shards
          merge-multiple: false

      - name: Verify the shards add up to the census
        if: needs.adaptation-boundary.outputs.full_tests == 'true'
        run: |
          python3 tools/run-tests.py --census \
            --suite-list "${{ runner.temp }}/shards/census-suite-list.tsv"
          status=0
          python3 tools/run-tests.py --verify-shards "${{ runner.temp }}/shards" \
            > "${{ runner.temp }}/verify-shards.txt" || status=$?
          cat "${{ runner.temp }}/verify-shards.txt"
          {
            echo '### Shard coverage'
            echo '```'
            cat "${{ runner.temp }}/verify-shards.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # Marks this merge-result tree as fully validated, for ci_scope.py on a later
  # main push. Written only after every expensive job passed on a pull request;
  # documentation-only, failed, cancelled and partial runs leave no marker.
  validated-tree-marker:
    needs: [adaptation-boundary, install-lifecycle, dispatch-pid-namespace, full-test-suite]
    if: >-
      github.event_name == 'pull_request' &&
      needs.adaptation-boundary.outputs.full_tests == 'true' &&
      needs.adaptation-boundary.result == 'success' &&
      needs.install-lifecycle.result == 'success' &&
      needs.dispatch-pid-namespace.result == 'success' &&
      needs.full-test-suite.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the tested merge result
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record the validated tree
        id: tree
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          mkdir -p "${{ runner.temp }}/marker"
          printf '{"tree":"%s","merge_sha":"%s","run_id":"%s"}\n' \
            "$tree" "$GITHUB_SHA" "$GITHUB_RUN_ID" > "${{ runner.temp }}/marker/validated-tree.json"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - name: Upload the validated-tree marker
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validated-tree-${{ steps.tree.outputs.tree }}
          path: ${{ runner.temp }}/marker/validated-tree.json
          overwrite: true
